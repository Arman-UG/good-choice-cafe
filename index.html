<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Old Batra Lemon — Order Online</title>
  <meta name="description" content="Street-style momos, burgers and sandwiches with ice-cold Banta soda. Order on WhatsApp." />
  <meta name="theme-color" content="#2F6E25" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg transform='rotate(-14 22 28)'%3E%3Cellipse cx='22' cy='28' rx='16.5' ry='11.5' fill='%23F4D34C'/%3E%3Cellipse cx='5.5' cy='28' rx='3.2' ry='4.2' fill='%23F4D34C'/%3E%3Cellipse cx='38.5' cy='28' rx='3.2' ry='4.2' fill='%23F4D34C'/%3E%3C/g%3E%3Cpath d='M27.5 14.5c3.5-6.5 10-9.5 15.5-9 0 5.5-3.5 11.5-9.5 13-3 .8-6-.7-6-4z' fill='%232F6E25'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Fraunces:ital,opsz,wght@1,9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "#F3F6EB",
            ink: "#1C271D",
            leaf: { 50:"#F1F6E9",100:"#DEEDCC",200:"#BCDBA0",300:"#8FC266",400:"#5EA43D",500:"#3F8A2B",600:"#2F6E25",700:"#275A1E",800:"#204A19",900:"#1B3C16",950:"#12250F" },
            lemon: { 50:"#FFFBEB",100:"#FBF0C0",200:"#F7E28B",300:"#F4D34C",400:"#EBBE26",500:"#CFA112",600:"#A87D0C",700:"#7F5D08" },
          },
          fontFamily: {
            sans: ["Archivo", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Fraunces", "Georgia", "serif"],
            mono: ["'Space Mono'", "ui-monospace", "monospace"],
          },
          keyframes: {
            marquee: { from: { transform: "translateX(0)" }, to: { transform: "translateX(-50%)" } },
            pop: { "0%": { transform: "scale(1)" }, "45%": { transform: "scale(1.18)" }, "100%": { transform: "scale(1)" } },
            fadeUp: { from: { opacity: "0", transform: "translateY(12px)" }, to: { opacity: "1", transform: "translateY(0)" } },
            fadeIn: { from: { opacity: "0" }, to: { opacity: "1" } },
            sheetUp: { from: { transform: "translateY(100%)" }, to: { transform: "translateY(0)" } },
          },
          animation: {
            marquee: "marquee 28s linear infinite",
            pop: "pop .4s cubic-bezier(.2,.8,.2,1)",
            "fade-up": "fadeUp .55s cubic-bezier(.2,.8,.2,1) both",
            "fade-in": "fadeIn .25s ease",
            "sheet-up": "sheetUp .32s cubic-bezier(.2,.8,.2,1)",
          },
        },
      },
    };
  </script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
      "lucide-react": "https://esm.sh/lucide-react@0.263?deps=react@18.3.1"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-paper">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import { ShoppingCart, Plus, Minus, CupSoda, Flame, ChevronUp, X, BadgePercent } from "lucide-react";

    /* ------------------------------------------------------------------ */
    /*  Data — the menu JSON exactly as supplied with added images         */
    /* ------------------------------------------------------------------ */
    const MENU = [
      { id: 1, name: "Fried Paneer Momos + Banta Soda Combo", price: 90, img: "image_5e29a6.jpeg" },
      { id: 2, name: "Kurkure Momos + Banta Soda Combo", price: 110, img: "image_5e29ab.jpeg" },
      { id: 3, name: "Gravy Malai Momos + Banta Soda Combo", price: 120, img: "image_5e29c5.jpeg" },
      { id: 4, name: "Aloo Tikki Burger + Banta Soda Combo", price: 70, img: "image_5e29c8.jpeg" },
      { id: 5, name: "Grill Sandwich + Banta Soda Combo", price: 90, img: "image_5e29cb.jpeg" },
      { id: 6, name: "Aloo Patties + Banta Soda Combo", price: 45, img: "image_5e29cd.jpeg" },
    ];

    /* Presentation layer: category, appetising one-liner, occasional badge */
    const META = {
      1: { cat: "Momos",    desc: "Crisp golden-fried paneer momos, fiery red chutney, one chilled Banta." },
      2: { cat: "Momos",    desc: "Momos rolled in crushed kurkure, tossed in schezwan — the counter classic.", tag: "Bestseller" },
      3: { cat: "Momos",    desc: "Steamed momos drowned in rich, creamy malai gravy. Our heaviest hitter." },
      4: { cat: "Burger",   desc: "Masala tikki, mint mayo, toasted bun — old-school Delhi style." },
      5: { cat: "Sandwich", desc: "Butter-grilled, triple-layered, green chutney, Banta on the side." },
      6: { cat: "Patty",    desc: "Flaky patty, masala onions, ketchup — the ₹45 legend of lunch breaks.", tag: "Value pick" },
    };

    const WHATSAPP_NUMBER = "9034711078"; // Updated to actual shop number

    const TICKER = [
      "Steamed fresh every hour",
      "Ice-cold Banta soda",
      "Chutney ground every morning",
      "Order on WhatsApp",
      "Authentic Taste",
    ];

    /* ------------------------------------------------------------------ */
    /*  Brand atoms                                                        */
    /* ------------------------------------------------------------------ */
    const LemonMark = ({ className = "h-9 w-9" }) => (
      <svg viewBox="0 0 48 48" className={className} aria-hidden="true">
        <path d="M27.5 14.5c3.5-6.5 10-9.5 15.5-9 0 5.5-3.5 11.5-9.5 13-3 .8-6-.7-6-4z" fill="#2F6E25" />
        <path d="M29 12.5c4-4 8.5-6.5 12.5-7" stroke="#F3F6EB" strokeWidth="1.4" strokeLinecap="round" fill="none" opacity="0.7" />
        <path d="M24.5 17.5c.3-2.5 1.5-4.5 3.5-5.5" stroke="#1B3C16" strokeWidth="2.2" strokeLinecap="round" fill="none" />
        <g transform="rotate(-14 22 28)">
          <ellipse cx="22" cy="28" rx="16.5" ry="11.5" fill="#F4D34C" />
          <ellipse cx="5.5" cy="28" rx="3.2" ry="4.2" fill="#F4D34C" />
          <ellipse cx="38.5" cy="28" rx="3.2" ry="4.2" fill="#F4D34C" />
          <path d="M9.5 23.5c2.5-3.5 7-5.5 11.5-5" stroke="#FBF0A0" strokeWidth="3" strokeLinecap="round" fill="none" />
        </g>
      </svg>
    );

    const VegMark = () => (
      <span className="inline-flex h-3.5 w-3.5 shrink-0 items-center justify-center rounded-[3px] border-[1.5px] border-leaf-600">
        <span className="h-[5px] w-[5px] rounded-full bg-leaf-600" />
      </span>
    );

    const WhatsAppGlyph = ({ className = "h-5 w-5" }) => (
      <svg viewBox="0 0 24 24" fill="currentColor" className={className} aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
      </svg>
    );

    /* ------------------------------------------------------------------ */
    /*  Cart → WhatsApp message builder                                    */
    /* ------------------------------------------------------------------ */
    const buildWhatsAppMessage = (entries, totalQty, totalAmount) => {
      const lines = entries.map(
        (e, i) => `${i + 1}. ${e.name}\n    ${e.qty} × ₹${e.price} = ₹${e.qty * e.price}`
      );
      return [
        "*OLD BATRA LEMON*",
        "*NEW ORDER*",
        "",
        lines.join("\n\n"),
        "",
        "------------------------------",
        `*TOTAL: ₹${totalAmount}* (${totalQty} item${totalQty === 1 ? "" : "s"})`,
        "",
        "Sent from the online menu — please confirm my order.",
      ].join("\n");
    };

    /* ------------------------------------------------------------------ */
    /*  Qty control                                                        */
    /* ------------------------------------------------------------------ */
    const QtyControl = ({ qty, onAdd, onRemove, label, compact = false }) => {
      const has = qty > 0;
      const iconSize = compact ? 13 : 16;
      return (
        <div className={`relative select-none ${compact ? "h-8 w-[92px]" : "h-10 w-[116px]"}`}>
          <button
            type="button"
            onClick={onAdd}
            aria-label={`Add ${label}`}
            className={`absolute inset-0 flex items-center justify-center gap-1 rounded-full bg-leaf-600 font-bold uppercase tracking-[0.1em] text-white shadow-[0_2px_8px_-3px_rgba(27,60,22,0.55)] transition-all duration-200 hover:bg-leaf-700 active:scale-95 ${compact ? "text-[12px]" : "text-[14px]"} ${has ? "invisible scale-90 opacity-0" : "scale-100 opacity-100"}`}
          >
            <Plus size={iconSize} strokeWidth={2.6} /> Add
          </button>

          <div
            role="group"
            aria-label={`${label} quantity`}
            className={`absolute inset-0 flex items-center overflow-hidden rounded-full bg-leaf-600 text-white transition-all duration-200 ${has ? "scale-100 opacity-100" : "invisible scale-90 opacity-0"}`}
          >
            <button
              type="button"
              onClick={onRemove}
              aria-label={`Remove one ${label}`}
              className={`flex shrink-0 items-center justify-center transition active:scale-90 ${compact ? "h-8 w-8" : "h-10 w-10"}`}
            >
              <Minus size={iconSize} strokeWidth={2.6} />
            </button>
            <span key={qty} className={`flex-1 animate-pop text-center font-mono font-bold tabular-nums ${compact ? "text-[14px]" : "text-[16px]"}`}>
              {qty}
            </span>
            <button
              type="button"
              onClick={onAdd}
              aria-label={`Add one ${label}`}
              className={`my-[3px] flex shrink-0 items-center justify-center rounded-full bg-white text-leaf-700 shadow-sm transition active:scale-90 ${compact ? "h-[26px] w-[26px]" : "h-[34px] w-[34px]"}`}
            >
              <Plus size={iconSize} strokeWidth={2.6} />
            </button>
          </div>
        </div>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  Header                                                             */
    /* ------------------------------------------------------------------ */
    const Header = ({ totalQty, scrolled, onCartClick }) => (
      <header className={`sticky top-0 z-40 transition-shadow duration-200 ${scrolled ? "shadow-[0_6px_20px_-8px_rgba(27,60,22,0.3)]" : ""}`}>
        <div className="h-[6px] bg-leaf-800" style={{ backgroundImage: "repeating-linear-gradient(-45deg, transparent 0 12px, #F4D34C 12px 16px)" }} />
        <div className={`border-b bg-white/95 backdrop-blur-sm transition-colors ${scrolled ? "border-leaf-900/10" : "border-transparent"}`}>
          <div className="mx-auto flex w-full max-w-xl items-center gap-2.5 px-3 py-3 md:max-w-3xl">
            <LemonMark className="h-10 w-10 shrink-0" />
            <div className="min-w-0 flex-1">
              <h1 className="font-display text-[24px] md:text-[28px] font-extrabold italic leading-[1.05] tracking-tight text-ink">
                Old Batra <span className="text-leaf-600">Lemon</span>
              </h1>
            </div>
            <button
              type="button"
              onClick={onCartClick}
              aria-label={`Open cart${totalQty ? ` (${totalQty} items)` : ""}`}
              className="relative flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-leaf-600 text-white transition hover:bg-leaf-700 active:scale-90"
            >
              <ShoppingCart size={22} strokeWidth={2.2} />
              {totalQty > 0 && (
                <span key={totalQty} className="absolute -right-1 -top-1 flex h-6 min-w-[24px] rotate-6 animate-pop items-center justify-center rounded-full bg-lemon-300 px-1 font-mono text-[13px] font-extrabold text-ink shadow">
                  {totalQty}
                </span>
              )}
            </button>
          </div>
        </div>
      </header>
    );

    /* ------------------------------------------------------------------ */
    /*  Ticker                                                             */
    /* ------------------------------------------------------------------ */
    const Ticker = () => (
      <div className="select-none overflow-hidden bg-leaf-800 text-leaf-100">
        <div className="flex w-max animate-marquee motion-reduce:animate-none hover:[animation-play-state:paused]">
          {[0, 1].map((dup) => (
            <div key={dup} className="flex shrink-0 items-center py-[9px]" aria-hidden={dup === 1 || undefined}>
              {TICKER.map((t) => (
                <span key={t} className="flex items-center whitespace-nowrap font-mono text-[12px] font-bold uppercase tracking-[0.22em]">
                  {t}
                  <span className="mx-4 inline-block h-1.5 w-1.5 rounded-full bg-lemon-300" />
                </span>
              ))}
            </div>
          ))}
        </div>
      </div>
    );

    /* ------------------------------------------------------------------ */
    /*  Menu card — Updated with Images and Bolder/Larger Fonts            */
    /* ------------------------------------------------------------------ */
    const MenuCard = ({ item, meta, index, qty, onAdd, onRemove }) => {
      const plusIdx = item.name.indexOf(" + ");
      const TagIcon = meta.tag === "Bestseller" ? Flame : meta.tag === "Value pick" ? BadgePercent : null;
      return (
        <article
          className="group relative flex animate-fade-up flex-col rounded-2xl border border-leaf-900/10 bg-white p-4 shadow-[0_2px_8px_rgba(27,60,22,0.08)] transition-shadow hover:shadow-[0_12px_28px_-12px_rgba(27,60,22,0.3)]"
          style={{ animationDelay: `${100 + index * 60}ms` }}
        >
          {/* Dynamic Image Wrapper */}
          {item.img && (
            <div className="mb-4 w-full h-56 overflow-hidden rounded-xl bg-leaf-50 border border-leaf-900/10 relative">
              <img src={item.img} alt={item.name} className="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105" loading="lazy" />
            </div>
          )}

          <div className="flex gap-3">
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-2">
                <span className="font-mono text-[11px] font-extrabold tracking-[0.12em] text-leaf-500">
                  NO.{String(item.id).padStart(2, "0")}
                </span>
                <span className="rounded border border-leaf-200 bg-leaf-50 px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-[0.14em] text-leaf-700">
                  {meta.cat}
                </span>
                {meta.tag && (
                  <span className="flex items-center gap-1 rounded-full bg-lemon-100 px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-[0.12em] text-lemon-700">
                    {TagIcon && <TagIcon size={12} strokeWidth={2.4} />}
                    {meta.tag}
                  </span>
                )}
              </div>

              <h3 className="mt-3 text-[18px] md:text-[20px] font-extrabold leading-snug tracking-[-0.01em] text-ink [font-stretch:108%]">
                {plusIdx > -1 ? (
                  <>
                    {item.name.slice(0, plusIdx)}
                    <span className="font-bold text-leaf-700">{item.name.slice(plusIdx)}</span>
                  </>
                ) : (
                  item.name
                )}
              </h3>
              <p className="mt-2 text-[14px] font-semibold leading-relaxed text-ink/70">{meta.desc}</p>
            </div>

            {/* Price sticker */}
            <div className="w-[64px] shrink-0 pt-1">
              <div className="mx-auto flex h-[60px] w-[60px] rotate-[-6deg] items-center justify-center rounded-full border border-lemon-600/50 bg-lemon-300 shadow-[inset_0_-3px_0_rgba(127,93,8,0.18),0_2px_5px_rgba(127,93,8,0.18)] transition-transform duration-300 group-hover:rotate-0">
                <span className="flex flex-col items-center">
                  <span className="font-mono text-[9px] font-extrabold uppercase tracking-[0.2em] text-ink/60">only</span>
                  <span className="mt-[1px] font-sans text-[18px] font-extrabold leading-none tracking-tight text-ink">₹{item.price}</span>
                </span>
              </div>
            </div>
          </div>

          <div className="mt-auto flex items-center justify-between pt-4">
            <span className="flex items-center gap-1.5 text-[12px] font-extrabold uppercase tracking-[0.1em] text-ink/50">
              <VegMark /> Veg
            </span>
            <QtyControl qty={qty} onAdd={onAdd} onRemove={onRemove} label={item.name} />
          </div>
        </article>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  Bottom action bar                                                  */
    /* ------------------------------------------------------------------ */
    const BottomBar = ({ totalQty, totalAmount, onOpenSheet, onSend }) => (
      <div className={`fixed inset-x-0 bottom-0 z-40 transition-transform duration-300 ease-[cubic-bezier(.2,.8,.2,1)] ${totalQty > 0 ? "visible translate-y-0" : "invisible translate-y-[125%]"}`}>
        <div className="mx-auto w-full max-w-xl px-3 pb-[max(env(safe-area-inset-bottom),10px)] md:max-w-3xl">
          <div className="flex items-center gap-2 rounded-2xl border border-leaf-900/10 bg-white p-2 pl-3 shadow-[0_-8px_28px_-10px_rgba(27,60,22,0.4)]">
            <button type="button" onClick={onOpenSheet} aria-label="Review your order" className="flex min-w-0 flex-1 items-center gap-3 text-left transition active:opacity-70">
              <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-leaf-200 bg-leaf-50 font-mono text-[15px] font-extrabold text-leaf-700">
                {totalQty}
              </span>
              <span className="min-w-0 leading-none">
                <span className="block text-[11px] font-extrabold uppercase tracking-[0.14em] text-ink/50">Your order</span>
                <span key={totalAmount} className="mt-[3px] block animate-pop text-[24px] font-extrabold leading-none tracking-tight tabular-nums text-ink">
                  ₹{totalAmount}
                </span>
              </span>
              <ChevronUp size={18} className="hidden shrink-0 text-ink/40 min-[400px]:block" />
            </button>
            <button
              type="button"
              onClick={onSend}
              className="flex h-[50px] shrink-0 items-center gap-2 rounded-xl bg-leaf-600 pl-4 pr-5 font-extrabold text-white shadow-[0_4px_14px_-4px_rgba(27,60,22,0.6)] transition hover:bg-leaf-700 active:scale-95"
            >
              <WhatsAppGlyph className="h-[20px] w-[20px]" />
              <span className="whitespace-nowrap text-[15px]">
                <span className="min-[380px]:hidden">Send order</span>
                <span className="hidden min-[380px]:inline">Send on WhatsApp</span>
              </span>
            </button>
          </div>
        </div>
      </div>
    );

    /* ------------------------------------------------------------------ */
    /*  Order sheet                                                        */
    /* ------------------------------------------------------------------ */
    const OrderSheet = ({ entries, totalQty, totalAmount, slipNo, onAdd, onRemove, onClose, onSend, closing }) => (
      <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label="Your order">
        <div className={`absolute inset-0 animate-fade-in bg-leaf-950/60 backdrop-blur-[2px] transition-opacity duration-200 ${closing ? "opacity-0" : "opacity-100"}`} onClick={onClose} />

        <div className={`relative mx-auto w-full max-w-md animate-sheet-up transition-transform duration-200 ease-out motion-reduce:animate-none ${closing ? "translate-y-full" : "translate-y-0"}`}>
          <div className="max-h-[78vh] overscroll-contain overflow-y-auto rounded-t-3xl bg-white px-5 pb-5 pt-3 shadow-2xl">
            <div className="mx-auto mb-3 h-1.5 w-12 rounded-full bg-ink/15" />

            <div className="flex items-start justify-between gap-3 pb-3">
              <div>
                <p className="font-mono text-[10px] font-extrabold uppercase tracking-[0.3em] text-leaf-600">
                  Order slip · No. {String(slipNo).padStart(3, "0")}
                </p>
                <h3 className="mt-1 font-display text-[26px] font-extrabold italic leading-tight text-ink">Your order</h3>
              </div>
              <button type="button" onClick={onClose} aria-label="Close order summary" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-ink/10 text-ink/60 transition hover:bg-ink/5 active:scale-90">
                <X size={18} strokeWidth={2.4} />
              </button>
            </div>

            <div className="border-t-2 border-dashed border-ink/20" />

            <ul className="divide-y divide-dashed divide-ink/20">
              {entries.map((e) => (
                <li key={e.id} className="flex items-center gap-3 py-4">
                  <QtyControl compact qty={e.qty} onAdd={() => onAdd(e.id)} onRemove={() => onRemove(e.id)} label={e.name} />
                  <div className="min-w-0 flex-1">
                    <p className="line-clamp-2 text-[14px] font-extrabold leading-snug text-ink">{e.name}</p>
                    <p className="mt-1 font-mono text-[12px] font-semibold text-ink/50">{e.qty} × ₹{e.price} each</p>
                  </div>
                  <span className="shrink-0 font-mono text-[18px] font-extrabold tabular-nums text-ink">₹{e.qty * e.price}</span>
                </li>
              ))}
            </ul>

            <div className="border-t-2 border-dashed border-ink/20" />

            <div className="flex items-baseline justify-between px-1 py-4">
              <span className="font-mono text-[13px] font-extrabold uppercase tracking-[0.22em] text-ink/60">
                Total · {totalQty} item{totalQty === 1 ? "" : "s"}
              </span>
              <span key={totalAmount} className="animate-pop font-mono text-[30px] font-extrabold leading-none tabular-nums text-ink">
                ₹{totalAmount}
              </span>
            </div>

            <button
              type="button"
              onClick={onSend}
              className="flex h-[56px] w-full items-center justify-center gap-2.5 rounded-2xl bg-leaf-600 text-[16px] font-extrabold text-white shadow-[0_6px_18px_-6px_rgba(27,60,22,0.7)] transition hover:bg-leaf-700 active:scale-[0.98]"
            >
              <WhatsAppGlyph className="h-6 w-6" />
              Send order to WhatsApp
            </button>
            <p className="pt-3 text-center font-mono text-[10px] font-bold uppercase tracking-[0.18em] text-ink/50">
              Opens in WhatsApp · Pay at the counter
            </p>
          </div>

          <svg className="block h-[12px] w-full" aria-hidden="true">
            <defs>
              <pattern id="tornEdge" width="14" height="12" patternUnits="userSpaceOnUse">
                <path d="M0 0 L7 12 L14 0 Z" fill="#ffffff" />
              </pattern>
            </defs>
            <rect width="100%" height="12" fill="url(#tornEdge)" />
          </svg>
        </div>
      </div>
    );

    /* ------------------------------------------------------------------ */
    /*  App                                                                */
    /* ------------------------------------------------------------------ */
    const App = () => {
      const [cart, setCart] = useState({});
      const [sheetOpen, setSheetOpen] = useState(false);
      const [closing, setClosing] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const [slipNo] = useState(() => 1 + Math.floor(Math.random() * 999));

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 6);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const entries = MENU.filter((m) => (cart[m.id] || 0) > 0).map((m) => ({ ...m, qty: cart[m.id] }));
      const totalQty = entries.reduce((s, e) => s + e.qty, 0);
      const totalAmount = entries.reduce((s, e) => s + e.qty * e.price, 0);

      const add = (id) => {
        setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
        if (navigator.vibrate) navigator.vibrate(8);
      };

      const remove = (id) => {
        setCart((c) => {
          const next = { ...c };
          const q = (next[id] || 0) - 1;
          if (q <= 0) delete next[id];
          else next[id] = q;
          return next;
        });
      };

      const closeSheet = useCallback(() => {
        setClosing(true);
        window.setTimeout(() => {
          setSheetOpen(false);
          setClosing(false);
        }, 200);
      }, []);

      const openSheet = () => {
        if (totalQty > 0) setSheetOpen(true);
      };

      useEffect(() => {
        if (sheetOpen && totalQty === 0) closeSheet();
      }, [sheetOpen, totalQty, closeSheet]);

      useEffect(() => {
        if (!sheetOpen) return;
        const onKey = (e) => e.key === "Escape" && closeSheet();
        window.addEventListener("keydown", onKey);
        document.body.style.overflow = "hidden";
        return () => {
          window.removeEventListener("keydown", onKey);
          document.body.style.overflow = "";
        };
      }, [sheetOpen, closeSheet]);

      const sendOrder = () => {
        const text = encodeURIComponent(buildWhatsAppMessage(entries, totalQty, totalAmount));
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank", "noopener,noreferrer");
        if (sheetOpen) closeSheet();
      };

      return (
        <div className="min-h-screen bg-paper font-sans text-ink antialiased selection:bg-lemon-200 selection:text-ink">
          <Header totalQty={totalQty} scrolled={scrolled} onCartClick={openSheet} />
          <Ticker />

          <main className="mx-auto w-full max-w-xl px-4 pb-32 md:max-w-3xl">
            {/* Section intro */}
            <div className="animate-fade-up pb-5 pt-6">
              <div className="flex items-end justify-between gap-3">
                <div>
                  <p className="font-mono text-[12px] font-extrabold uppercase tracking-[0.25em] text-leaf-600">Menu · Combos 01–06</p>
                  <h2 className="mt-2 font-display text-[32px] font-extrabold italic leading-none tracking-tight text-ink">Combos of the day</h2>
                </div>
                <span className="mb-1 flex shrink-0 items-center gap-1.5 rounded-full border border-leaf-200 bg-white px-3 py-1.5 text-[11px] font-extrabold uppercase tracking-wide text-leaf-700">
                  <VegMark /> Pure veg
                </span>
              </div>
              <p className="mt-3 flex max-w-md items-start gap-2 text-[14px] font-bold leading-relaxed text-ink/70">
                <CupSoda size={16} strokeWidth={2.4} className="mt-[2px] shrink-0 text-leaf-600" />
                Every combo lands with an ice-cold Banta soda — the way it's been at this counter.
              </p>
            </div>

            {/* Menu */}
            <div className="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-5">
              {MENU.map((item, i) => (
                <MenuCard
                  key={item.id}
                  item={item}
                  meta={META[item.id]}
                  index={i}
                  qty={cart[item.id] || 0}
                  onAdd={() => add(item.id)}
                  onRemove={() => remove(item.id)}
                />
              ))}
            </div>

            {/* Redesigned Footer Section */}
            <footer className="mt-10 mb-6 border-t border-dashed border-ink/20 px-4 pt-8 pb-6 text-center bg-white rounded-3xl shadow-sm">
              <LemonMark className="mx-auto h-12 w-12 opacity-90" />
              <h3 className="mt-4 font-display text-[24px] font-extrabold italic text-ink">Old Batra Lemon</h3>
              
              <address className="mt-3 text-[15px] font-bold not-italic leading-relaxed text-ink/80">
                Shop No. 196, Market, Sector 23,<br />Sonipat, Haryana 131001
              </address>
              
              <p className="mt-3 text-[17px] font-extrabold text-ink">
                Contact: <a href="tel:+919034711078" className="text-leaf-600 hover:underline">9034711078</a>
              </p>
              
              <div className="mt-6 mb-2 flex justify-center">
                <a href="https://chat.whatsapp.com/replace-with-invite-link" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 rounded-xl bg-[#25D366] px-5 py-3 text-[15px] font-extrabold text-white shadow-md hover:bg-[#1ebd5b] active:scale-95 transition-all">
                  <WhatsAppGlyph className="h-5 w-5" />
                  Join WhatsApp Group for Offers
                </a>
              </div>
              
              <p className="mt-8 font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-ink/40">Prices incl. taxes · Pay at counter</p>
            </footer>
          </main>

          <BottomBar totalQty={totalQty} totalAmount={totalAmount} onOpenSheet={openSheet} onSend={sendOrder} />

          {sheetOpen && (
            <OrderSheet
              entries={entries}
              totalQty={totalQty}
              totalAmount={totalAmount}
              slipNo={slipNo}
              onAdd={add}
              onRemove={remove}
              onClose={closeSheet}
              onSend={sendOrder}
              closing={closing}
            />
          )}
        </div>
      );
    };

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
